<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0f172a" />
  <circle cx="300" cy="200" r="150" stroke="#10b981" stroke-width="2" fill="none" opacity="0.5" />
  <circle cx="300" cy="200" r="100" stroke="#10b981" stroke-width="2" fill="none" opacity="0.7" />
  <circle cx="300" cy="200" r="50" stroke="#10b981" stroke-width="2" fill="none" />
  <line x1="300" y1="200" x2="450" y2="200" stroke="#10b981" stroke-width="2">
    <animateTransform attributeName="transform" type="rotate" from="0 300 200" to="360 300 200" dur="4s" repeatCount="indefinite" />
  </line>
  <circle cx="380" cy="150" r="5" fill="#ef4444">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </circle>
  <circle cx="250" cy="280" r="5" fill="#ef4444">
    <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <text x="30" y="370" fill="#10b981" font-family="monospace" font-size="20">&gt; scan_network --target=all</text>
</svg>
