<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="#f8fafc" />
  
  <!-- Outer Circle (Domain) -->
  <circle cx="300" cy="200" r="160" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="4" />
  <text x="300" y="60" text-anchor="middle" fill="#0369a1" font-family="sans-serif" font-weight="bold">Presentation</text>
  
  <!-- Middle Circle (Data) -->
  <circle cx="300" cy="200" r="110" fill="#dcfce7" stroke="#22c55e" stroke-width="4" />
  <text x="300" y="110" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-weight="bold">Data</text>
  
  <!-- Inner Circle (Domain) -->
  <circle cx="300" cy="200" r="60" fill="#fce7f3" stroke="#ec4899" stroke-width="4" />
  <text x="300" y="205" text-anchor="middle" fill="#be185d" font-family="sans-serif" font-weight="bold">Domain</text>
  
  <path d="M 300 200 L 450 350" stroke="#64748b" stroke-width="2" stroke-dasharray="5,5" />
  <text x="460" y="360" fill="#64748b" font-family="sans-serif" font-size="14">Dependency Rule</text>
</svg>
